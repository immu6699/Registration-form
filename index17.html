<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshVeggie - Organic Vegetables</title>
  <link rel="stylesheet" href="styles5.css">
</head>
<body>
  <header>
    <h1>🥬 FreshVeggie</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="home" class="hero">
    <h2>Fresh, Organic & Locally Grown Vegetables</h2>
    <p>Delivered straight from farm to your kitchen.</p>
    <a href="#products" class="btn">Shop Now</a>
  </section>

  <section id="products" class="products">
    <h2>Our Vegetables</h2>
    <div class="product-grid">
      <div class="product">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Tomato_je.jpg" alt="Tomato">
        <h3>Tomatoes</h3>
        <p>$2.50 / kg</p>
      </div>
      <div class="product">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Carrots.jpg" alt="Carrot">
        <h3>Carrots</h3>
        <p>6.80 / kg</p>
      </div>
      <div class="product">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/0c/Spinach_leaves.jpg" alt="Spinach">
        <h3>Spinach</h3>
        <p>$1.20 / bunch</p>
      </div>
      <div class="product">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Capsicum_annuum_%28Yellow_bell_pepper%29.jpg" alt="Bell Pepper">
        <h3>Bell Peppers</h3>
        <p>$3.00 / kg</p>
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <h2>Contact Us</h2>
    <form id="contactForm">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit" class="btn">Send Message</button>
    </form>
  </section>

  <footer>
    <p>© 2025 FreshVeggie. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
